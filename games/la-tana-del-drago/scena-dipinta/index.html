<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Ponte Levatoio — scena dipinta</title>
</head>
<body>
<!-- SCENA:START -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap');
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#06050a;color:#f4ece0;font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#palco{position:relative;width:100%;height:100dvh;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#140e1b 0%,#06050a 72%);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;border-radius:4px;box-shadow:0 26px 90px rgba(0,0,0,.85),0 0 0 1px rgba(232,184,75,.16)}
.velo{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;z-index:5;
  background:radial-gradient(ellipse at 50% 45%,rgba(16,11,22,.84) 0%,rgba(6,5,10,.96) 70%)}
.velo[hidden]{display:none}
.riq{max-width:600px}
h1{font-family:'Cinzel',Georgia,serif;font-weight:800;margin:0 0 4px;font-size:clamp(26px,6vw,46px);color:#e8b84b;
  letter-spacing:.03em;text-shadow:0 2px 0 #4a3410,0 0 32px rgba(232,184,75,.3)}
.occhiello{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.3em;color:#9b8a6c;margin:0 0 10px;text-transform:uppercase}
p.testo{font-size:clamp(13px,2.4vw,15.5px);color:#c7bba7;line-height:1.6;margin:0 0 20px}
p.testo b{color:#f0dcae;font-weight:600}
button{font-family:'Cinzel',Georgia,serif;font-weight:700;letter-spacing:.06em;font-size:clamp(14px,3vw,18px);color:#241704;cursor:pointer;
  background:linear-gradient(180deg,#f4d78d,#d19f2e);border:0;border-radius:10px;padding:12px 28px;
  box-shadow:0 4px 0 #7d5a1c,0 10px 26px rgba(232,184,75,.22)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #7d5a1c}
button.sec{background:linear-gradient(180deg,#4a4152,#332c3c);color:#e8dcc6;box-shadow:0 4px 0 #1d1826}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nota{margin-top:16px;font-size:11.5px;color:#857a68;line-height:1.5}
@media (orientation:portrait){#palco{align-items:flex-start;padding-top:8vh}}
#touch{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}
#touch.on{display:block}
.pb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:12px;background:rgba(244,236,224,.10);
  border:1px solid rgba(232,184,75,.3);color:#f0dcae;font-size:23px;display:grid;place-items:center;backdrop-filter:blur(3px)}
.pb:active{background:rgba(232,184,75,.34)}
.pb.su{left:74px;bottom:140px}.pb.giu{left:74px;bottom:16px}
.pb.sx{left:14px;bottom:78px}.pb.dx{left:134px;bottom:78px}
.pb.spada{right:18px;bottom:52px;width:88px;height:88px;border-radius:50%;font-size:14px;font-weight:700;font-family:'Cinzel',serif}
</style>

<div id="palco">
  <canvas id="tela"></canvas>

  <div class="velo" id="veloTitolo">
    <div class="riq">
      <p class="occhiello">Quadro 1</p>
      <h1 id="titoloScena">Il Ponte Levatoio</h1>
      <p class="testo" id="introScena"></p>
      <div class="fila"><button id="btnVia">Entra nel castello</button><button class="sec" id="btnAiuti">Aiuti a schermo: sì</button></div>
      <p class="nota">Frecce o <b>WASD</b> per muoverti, <b>Spazio</b> o <b>Z</b> per la spada.<br>
        Guarda cosa <b>lampeggia</b>: è lì che devi andare.</p>
    </div>
  </div>

  <div class="velo" id="veloEsito" hidden>
    <div class="riq">
      <h1 id="titoloEsito">—</h1>
      <p class="testo" id="testoEsito"></p>
      <div class="fila">
        <button id="btnAncora">Riprova</button>
        <button class="sec" id="btnTitolo">Torna al titolo</button>
      </div>
    </div>
  </div>

  <div id="touch">
    <div class="pb su" data-c="SU">&#8593;</div>
    <div class="pb giu" data-c="GIU">&#8595;</div>
    <div class="pb sx" data-c="SX">&#8592;</div>
    <div class="pb dx" data-c="DX">&#8594;</div>
    <div class="pb spada" data-c="SPADA">SPADA</div>
  </div>
</div>
<script>
/* ============================================================
   Il Ponte Levatoio — una scena sola, strutturata come un
   quadro di Dragon's Lair: segmenti filmati, un solo istante
   di decisione, due diramazioni (riuscita / morte).

   I segmenti possono essere immagini dipinte o clip video:
   il motore li tratta allo stesso modo, come faceva il
   lettore laserdisc con i capitoli del disco.
   ============================================================ */
(() => {
'use strict';

/* ---------- il copione della scena ---------- */
const SCENA = {
  id: 'ponte-levatoio',
  titolo: 'Il Ponte Levatoio',
  intro: 'Il castello di Mordroc si regge su una rupe sopra un fossato nero. ' +
         'L\'unica via d\'ingresso è un ponte di tavole marce — e qualcosa, sotto, si muove.',
  mossa: 'SU',
  etichetta: 'SALTA!',
  richiamo: { x: .80, y: .44 },     // dove lampeggia il bagliore: il portale da raggiungere
  segmenti: {
    approccio: {
      file: 'assets/01-approccio.png', durata: 3.2,
      didascalia: 'Dirk corre sul ponte levatoio',
      camera: { da: [.50, .52, 1.00], a: [.58, .50, 1.12] }
    },
    pericolo: {
      file: 'assets/02-pericolo.png', finestra: .85,
      didascalia: 'Le tavole cedono, il tentacolo esce dall\'acqua',
      camera: { da: [.52, .50, 1.14], a: [.50, .50, 1.04] }, scossa: .6
    },
    riuscita: {
      file: 'assets/03-riuscita.png', durata: 2.4,
      didascalia: 'Il salto verso il portale',
      camera: { da: [.44, .54, 1.16], a: [.60, .46, 1.02] }
    },
    morte: {
      file: 'assets/04-morte.png', durata: 2.8,
      didascalia: 'I tentacoli lo trascinano sotto',
      camera: { da: [.50, .44, 1.02], a: [.50, .58, 1.18] }
    }
  }
};

const L = 1280, A = 720;                       // palco 16:9, come le tavole dipinte
const tela = document.getElementById('tela');
const c = tela.getContext('2d');
let aiuti = true;                              // false = solo il lampeggio, come nel 1983

/* ---------- adattamento ---------- */
let scala = 1;
function adatta() {
  const box = document.getElementById('palco');
  const marg = window.innerWidth < 700 ? 8 : 26;
  scala = Math.min((box.clientWidth - marg) / L, (box.clientHeight - marg) / A);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  tela.style.width = (L * scala) + 'px'; tela.style.height = (A * scala) + 'px';
  tela.width = Math.round(L * scala * dpr); tela.height = Math.round(A * scala * dpr);
  c.setTransform(scala * dpr, 0, 0, scala * dpr, 0, 0);
}
window.addEventListener('resize', adatta);

/* ---------- utilità ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
const dolce = t => t * t * (3 - 2 * t);

/* ---------- audio ---------- */
let ac = null;
const audio = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; };
function nota(f, dur, tipo = 'square', vol = .07, rit = 0, f2 = null) {
  const x = audio(); if (!x) return;
  const t0 = x.currentTime + rit, o = x.createOscillator(), g = x.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t0 + dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(x.destination); o.start(t0); o.stop(t0 + dur + .05);
}
const Suoni = {
  lampo: () => { nota(1180, .09, 'square', .06); nota(1570, .09, 'square', .045, .07); },
  bene:  () => [660, 880, 1180].forEach((f, i) => nota(f, .13, 'triangle', .07, i * .06)),
  male:  () => { nota(300, .5, 'sawtooth', .08, 0, 60); [220, 170].forEach((f, i) => nota(f, .4, 'sawtooth', .06, .2 + i * .18)); }
};

/* ---------- caricamento dei segmenti ---------- */
const VIDEO = /\.(mp4|webm|mov|m4v)$/i;
const risorse = {};                            // nome -> {tipo, elem, pronto, errore}
function carica() {
  Object.entries(SCENA.segmenti).forEach(([nome, seg]) => {
    const r = { tipo: VIDEO.test(seg.file) ? 'video' : 'immagine', pronto: false, errore: false };
    risorse[nome] = r;
    if (r.tipo === 'video') {
      const v = document.createElement('video');
      v.src = seg.file; v.preload = 'auto'; v.playsInline = true; v.muted = false;
      v.addEventListener('loadeddata', () => { r.pronto = true; seg.durata = seg.durata || v.duration; });
      v.addEventListener('error', () => { r.errore = true; });
      r.elem = v;
    } else {
      const i = new Image();
      i.addEventListener('load', () => { r.pronto = true; });
      i.addEventListener('error', () => { r.errore = true; });
      i.src = seg.file;
      r.elem = i;
    }
  });
}
carica();

/* ---------- grana della pellicola ---------- */
const grana = document.createElement('canvas');
grana.width = grana.height = 220;
(() => {
  const g = grana.getContext('2d'), d = g.createImageData(220, 220);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 110 + Math.random() * 145;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
})();

/* ---------- stato ---------- */
const G = {
  stato: 'titolo',            // titolo | gioca | esito
  seg: 'approccio', t: 0,
  fase: 'scorre',             // scorre | finestra | risolto
  prec: null, dissolve: 0,    // crossfade
  vite: 3, punti: 0, vinto: false,
  lampo: 0, scossa: 0, tempo: 0
};

function vai(nome) {
  G.prec = { seg: G.seg, t: G.t };
  G.dissolve = 1;
  G.seg = nome; G.t = 0;
  G.fase = nome === 'pericolo' ? 'finestra' : 'scorre';
  const r = risorse[nome];
  if (r && r.tipo === 'video' && r.pronto) { try { r.elem.currentTime = 0; r.elem.play(); } catch (e) {} }
  if (nome === 'pericolo') { Suoni.lampo(); G.scossa = SCENA.segmenti.pericolo.scossa || .5; }
}
function iniziaScena() {
  G.stato = 'gioca'; G.vinto = false;
  G.prec = null; G.dissolve = 0;
  G.seg = 'approccio'; G.t = 0; G.fase = 'scorre';
  const r = risorse.approccio;
  if (r && r.tipo === 'video' && r.pronto) { try { r.elem.currentTime = 0; r.elem.play(); } catch (e) {} }
}
function premuto(cmd) {
  audio();
  if (G.stato !== 'gioca' || G.fase !== 'finestra') return;   // fuori tempo: ignorato
  if (cmd === SCENA.mossa) {
    const prontezza = clamp(1 - G.t / SCENA.segmenti.pericolo.finestra, 0, 1);
    G.punti += Math.round(100 + 150 * prontezza);
    G.lampo = .4; G.fase = 'risolto'; Suoni.bene(); vai('riuscita');
  } else { sbaglia(); }
}
function sbaglia() {
  G.fase = 'risolto'; G.vite--; G.scossa = .7; Suoni.male(); vai('morte');
}

/* ---------- ingressi ---------- */
const MAPPA = { ArrowUp: 'SU', KeyW: 'SU', ArrowDown: 'GIU', KeyS: 'GIU', ArrowLeft: 'SX', KeyA: 'SX', ArrowRight: 'DX', KeyD: 'DX', Space: 'SPADA', KeyZ: 'SPADA' };
window.addEventListener('keydown', e => {
  const cmd = MAPPA[e.code];
  if (cmd) { e.preventDefault(); premuto(cmd); }
}, { passive: false });
const zona = document.getElementById('touch');
if (window.matchMedia('(pointer:coarse)').matches) zona.classList.add('on');
zona.querySelectorAll('.pb').forEach(b => {
  const giu = e => { e.preventDefault(); premuto(b.dataset.c); };
  b.addEventListener('touchstart', giu, { passive: false });
  b.addEventListener('mousedown', giu);
});

/* ---------- disegno di un segmento (immagine o video, stessa regia) ---------- */
function durataDi(nome) { const s = SCENA.segmenti[nome]; return s.durata || s.finestra || 1; }

function disegnaSegmento(nome, t, alfa) {
  const seg = SCENA.segmenti[nome], r = risorse[nome];
  const p = dolce(clamp(t / durataDi(nome), 0, 1));
  const cam = seg.camera || { da: [.5, .5, 1], a: [.5, .5, 1] };
  const cx = lerp(cam.da[0], cam.a[0], p), cy = lerp(cam.da[1], cam.a[1], p), z = lerp(cam.da[2], cam.a[2], p);
  c.save(); c.globalAlpha = alfa;
  if (r && r.pronto) {
    const el = r.elem;
    const iw = r.tipo === 'video' ? el.videoWidth : el.naturalWidth;
    const ih = r.tipo === 'video' ? el.videoHeight : el.naturalHeight;
    if (iw && ih) {
      const k = Math.max(L / iw, A / ih) * z, dw = iw * k, dh = ih * k;
      const dx = clamp(L / 2 - cx * dw, L - dw, 0), dy = clamp(A / 2 - cy * dh, A - dh, 0);
      c.drawImage(el, dx, dy, dw, dh);
    }
  } else {
    segnaposto(nome, seg, r, p);
  }
  c.restore();
}

/* quando la tavola non c'è ancora: lo dice, non finge */
function segnaposto(nome, seg, r, p) {
  const g = c.createLinearGradient(0, 0, 0, A);
  g.addColorStop(0, '#241a2e'); g.addColorStop(1, '#0a0710');
  c.fillStyle = g; c.fillRect(0, 0, L, A);
  c.save(); c.translate(L / 2, A / 2 - 20 + p * 10);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = "700 13px 'Inter',sans-serif"; c.fillStyle = '#8a7c66';
  c.fillText((r && r.errore ? 'TAVOLA MANCANTE' : 'CARICAMENTO') + ' · ' + nome.toUpperCase(), 0, -56);
  c.font = "700 30px 'Cinzel',Georgia,serif"; c.fillStyle = '#e8b84b';
  c.fillText(seg.didascalia, 0, -14);
  c.font = "400 15px 'Inter',sans-serif"; c.fillStyle = '#9c8f7b';
  c.fillText(seg.file, 0, 26);
  c.strokeStyle = 'rgba(232,184,75,.28)'; c.lineWidth = 2;
  c.setLineDash([10, 8]); c.strokeRect(-320, -110, 640, 170); c.setLineDash([]);
  c.restore();
}

/* ---------- strati sopra l'immagine ---------- */
function pellicola() {
  c.save(); c.globalAlpha = .055; c.globalCompositeOperation = 'overlay';
  const ox = -Math.random() * 220, oy = -Math.random() * 220;
  for (let x = ox; x < L; x += 220) for (let y = oy; y < A; y += 220) c.drawImage(grana, x, y);
  c.restore();
  const v = c.createRadialGradient(L / 2, A / 2, A * .36, L / 2, A / 2, A * .95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.62)');
  c.fillStyle = v; c.fillRect(0, 0, L, A);
}
function pannello(x, y, w, h, alfa = .5) {
  c.fillStyle = 'rgba(6,5,10,' + alfa + ')';
  c.beginPath(); c.roundRect(x, y, w, h, 9); c.fill();
  c.strokeStyle = 'rgba(232,184,75,.26)'; c.lineWidth = 1.5; c.stroke();
}
function cuore(x, y, r, col) {
  c.save(); c.translate(x, y); c.scale(r / 10, r / 10);
  c.beginPath(); c.moveTo(0, 4);
  c.bezierCurveTo(-12, -6, -7, -14, 0, -8); c.bezierCurveTo(7, -14, 12, -6, 0, 4);
  c.closePath(); c.fillStyle = col; c.fill(); c.restore();
}
function hud() {
  pannello(20, 18, 150, 40);
  for (let i = 0; i < 3; i++) cuore(48 + i * 38, 38, 14, i < G.vite ? '#e0413c' : 'rgba(255,255,255,.14)');
  pannello(L - 210, 18, 190, 40);
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.font = "700 12px 'Inter',sans-serif"; c.fillStyle = '#a99a80'; c.fillText('PUNTI', L - 192, 38);
  c.textAlign = 'right'; c.font = "700 21px 'Cinzel',serif"; c.fillStyle = '#e8b84b';
  c.fillText(String(G.punti).padStart(6, '0'), L - 32, 38);
}

/* il bagliore: nell'originale lampeggiava l'oggetto verso cui muoversi */
function bagliore() {
  const r = SCENA.richiamo, x = r.x * L, y = r.y * A;
  const puls = .5 + .5 * Math.sin(G.tempo * 16);
  c.save(); c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(x, y, 4, x, y, 130 + puls * 34);
  g.addColorStop(0, 'rgba(255,240,200,' + (.55 + puls * .35) + ')');
  g.addColorStop(.35, 'rgba(255,196,90,' + (.22 + puls * .14) + ')');
  g.addColorStop(1, 'rgba(255,180,60,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, 130 + puls * 34, 0, 7); c.fill();
  c.restore();
  for (let i = 0; i < 2; i++) {
    const q = ((G.tempo * 1.5 + i * .5) % 1);
    c.strokeStyle = 'rgba(255,226,160,' + (.5 * (1 - q)) + ')'; c.lineWidth = 3;
    c.beginPath(); c.arc(x, y, 34 + q * 96, 0, 7); c.stroke();
  }
}
function richiamoUI() {
  const f = SCENA.segmenti.pericolo.finestra, resta = clamp(1 - G.t / f, 0, 1);
  const su = 1 - Math.pow(1 - clamp(G.t / .14, 0, 1), 3);
  c.save(); c.globalAlpha = .26 + Math.sin(G.t * 20) * .12;
  c.strokeStyle = '#e8b84b'; c.lineWidth = 12; c.strokeRect(6, 6, L - 12, A - 12); c.restore();
  if (!aiuti) return;
  const GLIFO = { SU: '↑', GIU: '↓', SX: '←', DX: '→', SPADA: '⚔' };
  c.save(); c.translate(L / 2, A - 96); c.scale(su, su);
  const w = 430;
  pannello(-w / 2, -48, w, 96, .72);
  c.save(); c.translate(-w / 2 + 56, 0);
  c.beginPath(); c.arc(0, 0, 32, 0, 7); c.fillStyle = 'rgba(232,184,75,.16)'; c.fill();
  c.strokeStyle = '#e8b84b'; c.lineWidth = 3; c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = "700 " + (SCENA.mossa === 'SPADA' ? 34 : 40) + "px 'Inter',sans-serif"; c.fillStyle = '#ffe6a3';
  c.fillText(GLIFO[SCENA.mossa], 0, 2); c.restore();
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.font = "700 26px 'Cinzel',Georgia,serif"; c.fillStyle = '#fff4d8';
  c.fillText(SCENA.etichetta, -w / 2 + 104, -12);
  const bx = -w / 2 + 104, bw = w / 2 - 24 - bx;
  c.fillStyle = 'rgba(255,255,255,.13)'; c.fillRect(bx, 14, bw, 11);
  c.fillStyle = resta > .45 ? '#7fe0a0' : resta > .2 ? '#e8b84b' : '#e0413c';
  c.fillRect(bx, 14, bw * resta, 11);
  c.restore();
}

/* ---------- ciclo ---------- */
function aggiorna(dt) {
  G.tempo += dt;
  G.lampo = Math.max(0, G.lampo - dt * 2.4);
  G.scossa = Math.max(0, G.scossa - dt * 1.7);
  if (G.dissolve > 0) G.dissolve = Math.max(0, G.dissolve - dt / .3);
  if (G.stato !== 'gioca') return;
  G.t += dt;
  const seg = SCENA.segmenti[G.seg];
  if (G.seg === 'approccio' && G.t >= seg.durata) vai('pericolo');
  else if (G.seg === 'pericolo' && G.fase === 'finestra' && G.t >= seg.finestra) sbaglia();
  else if (G.seg === 'riuscita' && G.t >= seg.durata) fine(true);
  else if (G.seg === 'morte' && G.t >= seg.durata) { G.vite > 0 ? iniziaScena() : fine(false); }
}
function disegna() {
  c.save();
  if (G.scossa > 0) c.translate((Math.random() - .5) * G.scossa * 18, (Math.random() - .5) * G.scossa * 13);
  if (G.stato === 'titolo') {
    disegnaSegmento('approccio', (G.tempo * .22) % durataDi('approccio'), 1);
  } else {
    if (G.prec && G.dissolve > 0) disegnaSegmento(G.prec.seg, G.prec.t, 1);
    disegnaSegmento(G.seg, G.t, G.prec && G.dissolve > 0 ? 1 - G.dissolve : 1);
  }
  pellicola();
  if (G.stato === 'gioca') {
    if (G.fase === 'finestra') { bagliore(); richiamoUI(); }
    hud();
  }
  c.restore();
  if (G.lampo > 0) { c.fillStyle = 'rgba(255,242,206,' + (G.lampo * .45) + ')'; c.fillRect(0, 0, L, A); }
  if (G.stato === 'gioca' && G.seg === 'morte') {
    c.fillStyle = 'rgba(150,12,12,' + clamp(.34 - G.t * .16, 0, .34) + ')'; c.fillRect(0, 0, L, A);
  }
}

/* ---------- veli ---------- */
const veloTitolo = document.getElementById('veloTitolo');
const veloEsito = document.getElementById('veloEsito');
document.getElementById('titoloScena').textContent = SCENA.titolo;
document.getElementById('introScena').textContent = SCENA.intro;

function fine(vinto) {
  G.stato = 'esito'; G.vinto = vinto;
  document.getElementById('titoloEsito').textContent = vinto ? 'Dentro il castello' : 'Il fossato ti ha preso';
  document.getElementById('testoEsito').innerHTML = vinto
    ? 'Le tavole cadono alle tue spalle, il portale si chiude: Dirk è dentro.<br><b>' + G.punti + '</b> punti.'
    : 'Tre vite, tre tuffi nel nero.<br><b>' + G.punti + '</b> punti.';
  document.getElementById('btnAncora').textContent = vinto ? 'Rigioca la scena' : 'Riprova';
  veloEsito.hidden = false;
}
document.getElementById('btnVia').addEventListener('click', () => {
  audio(); veloTitolo.hidden = true; G.vite = 3; G.punti = 0; iniziaScena();
});
document.getElementById('btnAncora').addEventListener('click', () => {
  audio(); veloEsito.hidden = true; G.vite = 3; G.punti = 0; iniziaScena();
});
document.getElementById('btnTitolo').addEventListener('click', () => {
  veloEsito.hidden = true; veloTitolo.hidden = false; G.stato = 'titolo';
});
const btnAiuti = document.getElementById('btnAiuti');
function scriviAiuti() { btnAiuti.textContent = aiuti ? 'Aiuti a schermo: sì' : 'Aiuti a schermo: no (1983)'; }
btnAiuti.addEventListener('click', () => { aiuti = !aiuti; scriviAiuti(); });
scriviAiuti();

/* un copione esterno, se il gioco è servito via http, ha la precedenza */
if (location.protocol.startsWith('http')) {
  fetch('scena.json').then(r => r.ok ? r.json() : null).then(j => {
    if (!j) return;
    Object.assign(SCENA, j);
    document.getElementById('titoloScena').textContent = SCENA.titolo;
    document.getElementById('introScena').textContent = SCENA.intro;
    carica();
  }).catch(() => {});
}

/* gancio di sola lettura per i test automatici */
window.__scena = () => ({ stato: G.stato, seg: G.seg, fase: G.fase, t: +G.t.toFixed(2), vite: G.vite, punti: G.punti,
  mossa: SCENA.mossa, tavole: Object.fromEntries(Object.entries(risorse).map(([k, r]) => [k, r.pronto ? 'ok' : r.errore ? 'mancante' : 'attesa'])) });

let ultimo = 0;
function frame(ts) {
  const dt = ultimo ? Math.min(.05, (ts - ultimo) / 1000) : 0;
  ultimo = ts; aggiorna(dt); disegna(); requestAnimationFrame(frame);
}
adatta();
requestAnimationFrame(frame);
})();

</script>
